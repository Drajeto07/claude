# Every pull request and every push to main is checked in full (корекции.docx §68):
# backend tests, the migrations and the postgres-marked tests on a real PostgreSQL,
# frontend lint, types, tests and build, a dependency audit, the end-to-end tests
# in a browser, and on pull requests a performance gate against the base branch. On main, the production images are built too, only after everything
# else has passed. Nothing is deployed from here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Fonts for the PDF export tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      # The security regression suite (TEST-030) on its own, then everything else: each test once.
      - name: Security regression suite
        run: python -m pytest -m security -q
      - name: Tests
        run: python -m pytest -m "not security" -q
      # TEST-021A: this platform's PDF claims for the expected-loss manifests (fonts differ by machine,
      # so PDF losses are compared only where they were recorded). Committed from the artifact with
      # `python -m scripts.merge_expected_losses DIR`, CI compares PDF losses too.
      - name: Record Linux PDF claims for the expected-loss manifests
        run: python -m scripts.export_expected_losses
      - name: Upload the Linux expected-loss manifests
        uses: actions/upload-artifact@v4
        with:
          name: expected-loss-linux
          path: backend/tests/fixtures/**/*.expected-loss.json
          retention-days: 30

  performance:
    # TEST-041: the change's benchmark against its base branch's, both measured here, one after
    # the other on the same runner (numbers from another machine say nothing). Pull requests only.
    name: Performance gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Fonts for the PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: The base branch, beside this change
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Benchmark the base, then this change
        run: |
          if [ ! -f "$RUNNER_TEMP/base/backend/scripts/benchmark.py" ]; then echo "The base has no benchmark yet: nothing to gate against."; exit 0; fi
          (cd "$RUNNER_TEMP/base/backend" && python -m scripts.benchmark --quick --repeats 3 --timeout 300 --out-dir "$RUNNER_TEMP/perf/base")
          python -m scripts.benchmark --quick --repeats 3 --timeout 300 --out-dir "$RUNNER_TEMP/perf/head"
      - name: Gate
        run: |
          if [ ! -f "$RUNNER_TEMP/perf/base/benchmarks.json" ]; then exit 0; fi
          python -m scripts.perf_gate --baseline "$RUNNER_TEMP/perf/base/benchmarks.json" --current "$RUNNER_TEMP/perf/head/benchmarks.json" --report "$RUNNER_TEMP/perf/gate.md"
      - name: The gate's table in the run summary
        if: always()
        run: if [ -f "$RUNNER_TEMP/perf/gate.md" ]; then cat "$RUNNER_TEMP/perf/gate.md" >> "$GITHUB_STEP_SUMMARY"; fi

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smartdoc
          POSTGRES_USER: smartdoc
          POSTGRES_PASSWORD: smartdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdoc -d smartdoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://smartdoc:smartdoc@localhost:5432/smartdoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # The dev lock: the app's dependencies plus pytest, for the tests below.
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Up to head, the models match, all the way down and up again
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      # The tests marked postgres (TEST-031) on this migrated database: what SQLite
      # can't show, such as the plan checks' row locks. The fixture empties the tables
      # after each test and refuses any host but this machine.
      - name: Tests on PostgreSQL
        env:
          SMARTDOC_TEST_POSTGRES_URL: postgresql+asyncpg://smartdoc:smartdoc@localhost:5432/smartdoc
        run: python -m pytest -m postgres -q -p no:cacheprovider

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Next generates the PageProps/LayoutProps types the app's pages use; without
      # them tsc reports them missing.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pip-audit is a CI tool, not one of the app's dependencies. The locks pin
      # every package with its hashes, so they are audited as they are, without
      # resolving or installing anything.
      - name: Backend locks (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --require-hashes --disable-pip
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
      # What ships to the browser and the Next server; dev tooling is not audited here.
      - name: Frontend production dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fonts for the PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - name: The backend's environment (playwright.config.ts starts it from backend/venv)
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
      - name: The frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: The report, when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  images:
    name: Production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, migrations, frontend, audit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file is valid
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: smartdoc-backend:${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: smartdoc-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid
