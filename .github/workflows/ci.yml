# Every pull request and every push to main is checked in full (корекции.docx §68):
# backend tests, the migrations on a real PostgreSQL, frontend lint, types, tests and
# build, and the end-to-end tests in a browser. On main, the production images are
# built too, only after everything else has passed. Nothing is deployed from here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Fonts for the PDF export tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Tests
        run: python -m pytest -q

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smartdoc
          POSTGRES_USER: smartdoc
          POSTGRES_PASSWORD: smartdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdoc -d smartdoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://smartdoc:smartdoc@localhost:5432/smartdoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - name: Up to head, the models match, all the way down and up again
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fonts for the PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
      - name: The backend's environment (playwright.config.ts starts it from backend/venv)
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
      - name: The frontend and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: The report, when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  images:
    name: Production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, migrations, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file is valid
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: smartdoc-backend:${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: smartdoc-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid
