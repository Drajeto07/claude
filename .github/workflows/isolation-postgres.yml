# D-012: the Preview isolation guard and the migrations, on a throwaway PostgreSQL.
#
# Isolated on purpose (owner's instruction, 2026-10-15):
# - runs on pushes to the 2.0 feature branch only (and by hand); never on pull_request_target;
# - the database is a service container created for this job on a GitHub-hosted runner and destroyed
#   with it; its user and password are fixed test values that open nothing else;
# - no secret is referenced anywhere in this file, and every setting the app reads is given explicitly
#   (no DATABASE_URL, Storage or S3 value of any real environment);
# - the token can only read the repository; checkout keeps no credentials;
# - nothing is built, published or deployed.

name: Isolation and migrations on PostgreSQL

on:
  push:
    branches: [feature/smartdoc-2.0]
    paths:
      - "backend/**"
      - ".github/workflows/isolation-postgres.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: isolation-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Empty database, migrations, isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smartdoc_ci
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_only -d smartdoc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Only the throwaway database above; the tests refuse any host but this machine.
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://ci_only:ci_only_not_a_secret@localhost:5432/smartdoc_ci
      SMARTDOC_TEST_POSTGRES_URL: postgresql+asyncpg://ci_only:ci_only_not_a_secret@localhost:5432/smartdoc_ci
      DATABASE_URL: postgresql+asyncpg://ci_only:ci_only_not_a_secret@localhost:5432/smartdoc_ci
      # Nothing real: local file storage, no named environment, no mail, no AI, no billing.
      STORAGE_BACKEND: local
      SMARTDOC_ENVIRONMENT: ""
      PRODUCTION_DB_REF: ""
      EMAIL_BACKEND: disabled
      ANTHROPIC_API_KEY: ""
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: The database starts completely empty
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["ALEMBIC_DATABASE_URL"])
              async with engine.connect() as connection:
                  tables = (await connection.execute(text("SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema')"))).scalar()
              await engine.dispose()
              print(f"tables before migrating: {tables}")
              assert tables == 0, "the CI database is not empty"

          asyncio.run(main())
          PY
      - name: Migrations on the empty database, the model check, all the way down and up again
        run: |
          alembic upgrade head
          alembic current
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Preview isolation tests (all, including the PostgreSQL ones)
        run: python -m pytest tests/test_preview_isolation.py -v -rA -p no:cacheprovider --junitxml=isolation.xml
      - name: Every PostgreSQL-marked test
        run: python -m pytest -m postgres -v -rA -p no:cacheprovider --junitxml=postgres.xml
      - name: Results in the run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, xml.etree.ElementTree as ET
          for name in ("isolation.xml", "postgres.xml"):
              path = pathlib.Path(name)
              if not path.exists():
                  print(f"### {name}: not produced"); continue
              suite = ET.parse(path).getroot()
              suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
              total, failed = int(suite.get("tests")), int(suite.get("failures")) + int(suite.get("errors"))
              skipped = int(suite.get("skipped"))
              print(f"### {name}: {total - failed - skipped} passed, {failed} failed, {skipped} skipped\n")
              for case in suite.iter("testcase"):
                  state = "FAILED" if case.find("failure") is not None or case.find("error") is not None else "skipped" if case.find("skipped") is not None else "passed"
                  print(f"- {state}: `{case.get('name')}`")
              print()
          PY
